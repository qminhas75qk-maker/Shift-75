<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0d1117">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GetCab">
<title>GetCab — Shift Console</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
  :root{
    --bg:#0d1117;
    --surface:#141b23;
    --surface2:#1b232d;
    --surface3:#222c38;
    --border:#28313d;
    --text:#e7edf3;
    --text-dim:#8b97a5;
    --text-faint:#5c6773;
    --amber:#e8a33d;
    --amber-bg:rgba(232,163,61,0.10);
    --amber-bg-strong:rgba(232,163,61,0.18);
    --green:#3ecf8e;
    --green-bg:rgba(62,207,142,0.10);
    --red:#e0596b;
    --red-bg:rgba(224,89,107,0.10);
    --teal:#38c4d9;
    --mono: ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--sans);-webkit-tap-highlight-color:transparent;}
  body{padding-bottom:72px;}
  ::selection{background:var(--teal);color:#04141a;}

  /* ---------- Header ---------- */
  header{
    position:sticky; top:0; z-index:40;
    background:linear-gradient(180deg, #101720 0%, #0d1117 100%);
    border-bottom:1px solid var(--border);
    padding:14px 16px 0 16px;
  }
  .brandrow{display:flex; align-items:center; justify-content:space-between; gap:10px;}
  .brand{display:flex; align-items:baseline; gap:8px;}
  .brand .mark{
    width:30px;height:30px;border-radius:8px;
    background:linear-gradient(135deg, var(--amber), #c97a1f);
    display:flex;align-items:center;justify-content:center;
    font-weight:800; font-size:15px; color:#1a1305; flex:none;
  }
  .brand h1{font-size:16px; margin:0; font-weight:700; letter-spacing:0.2px;}
  .brand .sub{font-size:11px; color:var(--text-dim); font-family:var(--mono);}
  .clockbox{text-align:right;}
  .clockbox .time{font-family:var(--mono); font-size:15px; font-weight:600; color:var(--teal);}
  .clockbox .date{font-size:10.5px; color:var(--text-dim); font-family:var(--mono);}

  .opline{display:flex; gap:14px; padding:10px 0 12px 0; font-size:11.5px; color:var(--text-dim); font-family:var(--mono); flex-wrap:wrap;}
  .opline b{color:var(--text);}

  nav.tabs{display:flex; gap:4px; overflow-x:auto; padding-bottom:2px; scrollbar-width:none;}
  nav.tabs::-webkit-scrollbar{display:none;}
  nav.tabs button{
    flex:none; background:transparent; border:none; color:var(--text-dim);
    font-family:var(--sans); font-size:13.5px; font-weight:600; padding:10px 14px 12px 14px;
    border-bottom:2px solid transparent; cursor:pointer; white-space:nowrap;
  }
  nav.tabs button .dot{display:inline-block; width:6px; height:6px; border-radius:50%; margin-right:6px; vertical-align:middle;}
  nav.tabs button.active{color:var(--text); border-bottom-color:var(--teal);}

  main{max-width:720px; margin:0 auto; padding:16px;}

  /* ---------- Banner ---------- */
  .banner{
    display:flex; gap:10px; align-items:flex-start;
    background:var(--red-bg); border:1px solid rgba(224,89,107,0.35);
    padding:12px 14px; border-radius:10px; margin-bottom:16px; font-size:13px; line-height:1.5;
  }
  .banner.warn{background:var(--amber-bg); border-color:rgba(232,163,61,0.35);}
  .banner .ico{flex:none; font-size:16px;}
  .banner b{display:block; margin-bottom:2px;}
  .banner ul{margin:6px 0 0 0; padding-left:18px; color:var(--text-dim);}

  /* ---------- Section ---------- */
  .section{margin-bottom:22px;}
  .section-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:8px;}
  .section-head h2{font-size:13px; margin:0; text-transform:none; color:var(--text); font-weight:700; display:flex; align-items:center; gap:8px;}
  .section-head .num{
    width:20px;height:20px;border-radius:6px;background:var(--surface3);
    display:inline-flex;align-items:center;justify-content:center;
    font-family:var(--mono); font-size:11px; color:var(--text-dim); flex:none;
  }
  .section-head .count{font-family:var(--mono); font-size:11px; color:var(--text-faint);}

  .card{
    background:var(--surface); border:1px solid var(--border); border-radius:12px;
    overflow:hidden;
  }

  /* ---------- Task Item ---------- */
  .item{
    display:flex; align-items:flex-start; gap:11px;
    padding:13px 14px; border-bottom:1px solid var(--border);
    border-left:3px solid transparent;
    transition:background 0.15s;
  }
  .item:last-child{border-bottom:none;}
  .item.pending{background:var(--amber-bg); border-left-color:var(--amber);}
  .item.complete{background:var(--green-bg); border-left-color:var(--green);}
  .item.urgent{background:var(--red-bg); border-left-color:var(--red);}

  .chk{
    width:21px; height:21px; border-radius:6px; border:1.5px solid var(--text-faint);
    flex:none; margin-top:1px; cursor:pointer; background:transparent;
    display:flex; align-items:center; justify-content:center; font-size:13px; color:transparent;
  }
  .item.complete .chk{background:var(--green); border-color:var(--green); color:#04140b;}
  .item.pending .chk, .item.urgent .chk{border-color:var(--amber);}
  .item.urgent .chk{border-color:var(--red);}

  .item .body{flex:1; min-width:0;}
  .item .label{font-size:13.8px; line-height:1.4; color:var(--text);}
  .item.complete .label{color:var(--text-dim); text-decoration:line-through; text-decoration-color:var(--text-faint);}
  .item .hint{font-size:11.5px; color:var(--text-dim); margin-top:3px; line-height:1.4;}
  .item .del{flex:none; background:none; border:none; color:var(--text-faint); font-size:16px; cursor:pointer; padding:2px 4px;}
  .item .del:hover{color:var(--red);}

  .badge{
    display:inline-block; font-family:var(--mono); font-size:10px; padding:2px 6px;
    border-radius:5px; background:var(--surface3); color:var(--text-dim); margin-top:5px; margin-right:5px;
  }

  /* ---------- Sub-toggle rows (emails etc) ---------- */
  .subgrid{display:grid; grid-template-columns:1fr 1fr; gap:8px; padding:12px 14px;}
  .subgrid .full{grid-column:1/-1; font-size:11.5px; color:var(--text-dim); font-family:var(--mono); margin-top:4px;}
  .togglechip{
    display:flex; align-items:center; gap:8px; padding:9px 10px; border-radius:9px;
    background:var(--surface2); border:1px solid var(--border); cursor:pointer; font-size:12.5px;
  }
  .togglechip .dot2{width:9px;height:9px;border-radius:50%;background:var(--text-faint); flex:none;}
  .togglechip.on{background:var(--green-bg); border-color:rgba(62,207,142,0.35);}
  .togglechip.on .dot2{background:var(--green);}

  /* ---------- Add row ---------- */
  .addrow{display:flex; gap:8px; padding:12px 14px;}
  .addrow input, .addrow select{
    flex:1; background:var(--surface2); border:1px solid var(--border); border-radius:8px;
    padding:10px 11px; color:var(--text); font-size:13.5px; font-family:var(--sans); min-width:0;
  }
  .addrow input::placeholder{color:var(--text-faint);}
  .btn{
    background:var(--teal); color:#03191d; border:none; border-radius:8px; padding:10px 14px;
    font-weight:700; font-size:13px; cursor:pointer; flex:none;
  }
  .btn.ghost{background:transparent; border:1px solid var(--border); color:var(--text-dim);}
  .btn.small{padding:7px 10px; font-size:12px;}
  .btn:disabled{opacity:0.35; cursor:not-allowed;}
  .btn.amberbtn{background:var(--amber); color:#20140a;}

  .empty{padding:22px 14px; text-align:center; color:var(--text-faint); font-size:12.5px;}

  /* Two-column source picker */
  .sourcepick{display:flex; gap:8px; padding:12px 14px 4px 14px;}
  .sourcepick button{
    flex:1; background:var(--surface2); border:1px solid var(--border); border-radius:9px;
    padding:12px 8px; color:var(--text); font-size:12px; font-weight:600; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; gap:4px;
  }
  .sourcepick button .ic{font-size:18px;}
  .sourcepick button.sel{border-color:var(--teal); background:rgba(56,196,217,0.12); color:var(--teal);}

  /* Notes list */
  .noteitem{display:flex; gap:10px; padding:12px 14px; border-bottom:1px solid var(--border); align-items:flex-start;}
  .noteitem:last-child{border-bottom:none;}
  .noteitem .txt{flex:1; font-size:13.3px; line-height:1.45;}
  .noteitem.done .txt{color:var(--text-dim); text-decoration:line-through;}
  .noteitem .ts{font-size:10px; color:var(--text-faint); font-family:var(--mono); margin-top:3px;}

  /* Yesterday readonly */
  .ro-row{display:flex; align-items:center; gap:10px; padding:11px 14px; border-bottom:1px solid var(--border); font-size:13px;}
  .ro-row:last-child{border-bottom:none;}
  .ro-row .tick{width:16px; font-size:13px; flex:none;}
  .ro-row.done{color:var(--text-dim);}
  .ro-row.miss{color:var(--red);}

  .footer-note{text-align:center; color:var(--text-faint); font-size:11px; padding:24px 10px 6px 10px; font-family:var(--mono);}

  /* ---------- Report form ---------- */
  .rowline{display:flex; align-items:center; gap:8px; padding:9px 10px; border-bottom:1px solid var(--border);}
  .rowline:last-child{border-bottom:none;}
  .rowline input[type=text], .rowline input[type=number]{
    background:var(--surface2); border:1px solid var(--border); border-radius:7px; color:var(--text);
    padding:8px 9px; font-size:13px; font-family:var(--sans); min-width:0;
  }
  .rowline input[type=number]{width:70px; text-align:center;}
  .rowline select{background:var(--surface2); border:1px solid var(--border); border-radius:7px; color:var(--text); padding:8px 9px; font-size:12.5px;}
  .rowline .rlbl{flex:none; width:34px; font-family:var(--mono); font-size:11px; color:var(--text-faint);}
  .rowline .grow{flex:1; min-width:0;}
  .rowline .rmv{flex:none; background:none; border:none; color:var(--text-faint); font-size:15px; cursor:pointer;}
  .acct2{display:flex; gap:8px; align-items:center;}
  .acct2 input[type=text]{flex:1;}
  .acct2 input[type=number]{width:56px;}

  .formfield{padding:10px 14px; border-bottom:1px solid var(--border);}
  .formfield:last-child{border-bottom:none;}
  .formfield label{display:block; font-size:11.5px; color:var(--text-dim); margin-bottom:5px; font-family:var(--mono);}
  .formfield input[type=text], .formfield textarea{
    width:100%; background:var(--surface2); border:1px solid var(--border); border-radius:8px;
    padding:9px 10px; color:var(--text); font-size:13.3px; font-family:var(--sans); resize:vertical;
  }
  .vehgrid{display:grid; grid-template-columns:repeat(auto-fit, minmax(84px,1fr)); gap:8px; padding:12px 14px;}
  .vehgrid div{display:flex; flex-direction:column; gap:5px;}
  .vehgrid label{font-size:11px; color:var(--text-dim); font-family:var(--mono);}
  .vehgrid input{background:var(--surface2); border:1px solid var(--border); border-radius:7px; color:var(--text); padding:8px; text-align:center; font-size:14px;}

  .rowadd{padding:10px 14px;}
  .toolbar{display:flex; gap:8px; flex-wrap:wrap; margin:14px 0 6px 0;}
  .toolbar .btn{flex:1; min-width:130px; text-align:center;}

  /* ---------- Autocomplete dropdown ---------- */
  .ac-drop{
    position:fixed; background:var(--surface2); border:1px solid var(--border); border-radius:9px;
    max-height:170px; overflow-y:auto; z-index:200; box-shadow:0 10px 26px rgba(0,0,0,0.45);
  }
  .ac-drop div{padding:10px 12px; font-size:13px; cursor:pointer; border-bottom:1px solid var(--border);}
  .ac-drop div:last-child{border-bottom:none;}
  .ac-drop div:hover, .ac-drop div:active{background:var(--surface3);}

  /* ---------- Priority banners ---------- */
  .banner.danger{background:var(--red-bg); border-color:rgba(224,89,107,0.4);}
  .banner a.lnk{color:var(--teal); text-decoration:underline; cursor:pointer; font-size:12.5px;}

  /* ---------- Follow-up due badges ---------- */
  .duebadge{font-family:var(--mono); font-size:10.5px; padding:2px 7px; border-radius:5px; margin-top:5px; display:inline-block;}
  .duebadge.over{background:rgba(224,89,107,0.18); color:var(--red);}
  .duebadge.soon{background:rgba(232,163,61,0.18); color:var(--amber);}
  .duebadge.ok{background:var(--surface3); color:var(--text-dim);}

  .followform{display:flex; flex-direction:column; gap:8px; padding:12px 14px;}
  .followform input[type=text], .followform input[type=datetime-local]{
    background:var(--surface2); border:1px solid var(--border); border-radius:8px;
    padding:9px 10px; color:var(--text); font-size:13.3px; font-family:var(--sans); width:100%;
  }
  .followform .chkrow{display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--text-dim);}

  /* ---------- Scripts library ---------- */
  .scriptcard{border-bottom:1px solid var(--border); padding:13px 14px;}
  .scriptcard:last-child{border-bottom:none;}
  .scriptcard .stopic{font-weight:700; font-size:13.5px; color:var(--teal); margin-bottom:6px;}
  .scriptcard .sbody{
    white-space:pre-wrap; font-size:13px; line-height:1.55; color:var(--text);
    background:var(--surface2); border:1px solid var(--border); border-radius:8px; padding:10px 11px; margin-bottom:8px;
  }
  .scriptcard .sactions{display:flex; gap:8px; flex-wrap:wrap;}
  .scriptcard .sactions button{
    flex:none; background:var(--surface3); border:1px solid var(--border); color:var(--text-dim);
    border-radius:7px; padding:6px 11px; font-size:11.5px; font-weight:600; cursor:pointer;
  }
  .scriptcard .sactions button.copybtn{color:var(--green); border-color:rgba(62,207,142,0.35);}
  .scriptcard .sactions button.editbtn{color:var(--amber); border-color:rgba(232,163,61,0.35);}
  .scriptcard .sactions button.delbtn{color:var(--red); border-color:rgba(224,89,107,0.35);}
  .scripteditform textarea{
    width:100%; min-height:110px; background:var(--surface2); border:1px solid var(--border); border-radius:8px;
    color:var(--text); padding:9px 10px; font-size:13px; font-family:var(--sans); resize:vertical; margin-top:6px;
  }

  @media (max-width:420px){
    .subgrid{grid-template-columns:1fr;}
  }
</style>
</head>
<body>

<header>
  <div class="brandrow">
    <div class="brand">
      <div class="mark">GC</div>
      <div>
        <h1>GetCab</h1>
        <div class="sub">Operator: Qasim</div>
      </div>
    </div>
    <div class="clockbox">
      <div class="time" id="clockTime">--:--</div>
      <div class="date" id="clockDate">-- --- ----</div>
    </div>
  </div>
  <div class="opline">
    <span>Shift: <b>Evening / Night</b></span>
    <span>Status: <b id="statusLine">loading…</b></span>
    <span id="syncBadge">⚪ Checking sync…</span>
  </div>
  <nav class="tabs" id="tabs">
    <button data-tab="today" class="active">📋 Today</button>
    <button data-tab="tomorrow">🌙 Tomorrow</button>
    <button data-tab="yesterday">🕓 Yesterday</button>
    <button data-tab="notes">📝 Manager Notes</button>
    <button data-tab="mistakes">⚠️ Mistakes</button>
    <button data-tab="questions">❓ Questions</button>
    <button data-tab="followups">⏳ Follow-ups</button>
    <button data-tab="scripts">📜 Scripts</button>
    <button data-tab="report">🧾 Report</button>
  </nav>
</header>

<main id="main"></main>

<div class="footer-note">GetCab Shift Console — data saved automatically</div>

<script>
/* ============================================================
   GetCab Operator Shift Console
   Persistence via window.storage (personal, per-user)
   ============================================================ */

const FIXED_TASKS = [
  {id:'t1', label:'Urgent check — any job in progress right now?', hint:'Driver on-route calls, anything that needs handling this exact second before anything else.'},
  {id:'t2', label:'Check all 3 inboxes', hint:'info@getcab.uk · booking@getcab.uk · info@myairporttrips.com — Inbox and Sent both.', sub:'emails'},
  {id:'t3', label:'Check job assignments', hint:'Make sure every job is assigned correctly — nothing wrong, nothing missing.'},
  {id:'t4', label:'Review tomorrow\'s jobs', hint:'Check every job carefully — remove cancelled ones, add new ones.', sub:'tomorrowlink'},
  {id:'t5', label:'Check yesterday + pre-shift jobs for No-Shows', hint:'Confirm any No-Show is marked, and proof has been uploaded for it.'},
  {id:'t6', label:'Today\'s job tracking setup', hint:'Open all flights in one Chrome tab group. Set mobile alarms for town pickups (on-route call time). Open all of today\'s Talixo jobs in one group to mark arrivals on time.', sub:'jobtracking'},
  {id:'t7', label:'Handle today\'s progressing jobs', hint:'Call companies (Ctrip excluded) about jobs in progress. Track each customer one by one until pickup is done.', sub:'calls'},
  {id:'t8', label:'Make a note for the manager', hint:'Anything worth flagging at shift close — jot it down as it happens.', sub:'noteslink'},
  {id:'t9', label:'Send No-Show proof', hint:'For every No-Show today, prepare and upload the proof before closing.', sub:'noshow'},
];

const todayKey = dateKey(new Date());
const tomorrowKey = dateKey(addDays(new Date(),1));
const yesterdayKey = dateKey(addDays(new Date(),-1));

let state = {}; // in-memory cache of loaded day objects, keyed by date string
let activeTab = 'today';

/* ---------------- Storage layer ----------------
   Three tiers, tried in order:
   1. Firebase (if FIREBASE_CONFIG below is filled in) — real sync across every
      device you open this page on (phone, laptop, anywhere).
   2. window.storage — only present when running inside Claude.ai itself.
   3. The browser's own localStorage — works, but is local to THIS device/browser
      only. This is the fallback that was used before Firebase was set up.

   ===== TO TURN ON CROSS-DEVICE SYNC =====
   1. Go to https://console.firebase.google.com → Add project (free, no card needed).
   2. In the project: Build → Firestore Database → Create database → Start in
      "test mode" for now (we tighten the rule below in a moment).
   3. Project settings (gear icon) → General → "Your apps" → click the </> (web)
      icon → register an app (nickname anything) → copy the firebaseConfig object
      it shows you → paste its values into FIREBASE_CONFIG below.
   4. Pick your own private APP_KEY below (any random word/string only you know —
      it keeps your data separate from anyone else who might ever use this same
      Firebase project). Use the same APP_KEY on every device.
   5. Back in Firestore → Rules tab, replace the rules with:
        rules_version = '2';
        service cloud.firestore {
          match /databases/{database}/documents {
            match /consoles/{appKey}/entries/{entry} {
              allow read, write: if appKey == "PASTE_YOUR_APP_KEY_HERE";
            }
          }
        }
      (replace PASTE_YOUR_APP_KEY_HERE with your real APP_KEY, in quotes) → Publish.
   6. Re-upload this file to GitHub Pages. Open it on both devices — they'll now
      share the same data automatically, a few seconds after each change.
   If you leave FIREBASE_CONFIG empty, the app works exactly as before (saves
   locally to whichever device you're using, no sync). */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyDi5z0cAn_CPivTR9O6lgxAQCc1jjxmZ0U",
  authDomain: "shift-75.firebaseapp.com",
  projectId: "shift-75",
  storageBucket: "shift-75.firebasestorage.app",
  messagingSenderId: "952822599874",
  appId: "1:952822599874:web:38e80473aa87f1ef68ab5b"
};
const APP_KEY = "qasim-a97d202587fc9124dfd196de"; // private — do not share this file/value with anyone else

let firestoreDB = null;
let FIREBASE_READY = false;
if(FIREBASE_CONFIG.apiKey && FIREBASE_CONFIG.projectId){
  try{
    firebase.initializeApp(FIREBASE_CONFIG);
    firestoreDB = firebase.firestore();
    FIREBASE_READY = true;
  }catch(e){ console.error('Firebase init failed', e); FIREBASE_READY = false; }
}

const HAS_CLOUD_STORAGE = (typeof window.storage !== 'undefined' && window.storage && typeof window.storage.get === 'function');

function firestoreDocRef(key){
  return firestoreDB.collection('consoles').doc(APP_KEY).collection('entries').doc(encodeURIComponent(key));
}

let pendingWrites = 0;
let lastWriteError = null;

async function storageGet(key){
  if(FIREBASE_READY){
    try{
      const snap = await firestoreDocRef(key).get();
      if(snap.exists) return { key, value: snap.data().value };
      return null;
    }catch(e){
      console.error('Firestore read failed', e);
      lastWriteError = 'read: ' + (e.code || e.message);
      try{ updateSyncBadge(); }catch(_){}
      try{ const v = localStorage.getItem('getcab_'+key); return v!==null ? {key, value:v} : null; }catch(_){ return null; }
    }
  }
  if(HAS_CLOUD_STORAGE){
    try{ return await window.storage.get(key, false); }
    catch(e){ return null; }
  }
  try{
    const v = localStorage.getItem('getcab_'+key);
    return v!==null ? {key, value:v} : null;
  }catch(e){ return null; }
}
async function storageSet(key, value){
  // always keep a local backup copy first, so a failed cloud write never loses data
  try{ localStorage.setItem('getcab_'+key, value); }catch(e){}
  if(FIREBASE_READY){
    pendingWrites++;
    try{
      await firestoreDocRef(key).set({ value, updatedAt: Date.now() });
      lastWriteError = null;
      return { key, value };
    }catch(e){
      console.error('Firestore write failed', e);
      lastWriteError = 'write: ' + (e.code || e.message);
      return null;
    }finally{
      pendingWrites--;
      try{ updateSyncBadge(); }catch(_){}
    }
  }
  if(HAS_CLOUD_STORAGE){
    try{ return await window.storage.set(key, value, false); }
    catch(e){ return null; }
  }
  return {key, value};
}

function dateKey(d){

async function loadDay(key){
  if(state[key]) return state[key];
  try{
    const res = await storageGet('day:'+key);
    if(res && res.value){
      const parsed = JSON.parse(res.value);
      state[key] = Object.assign(blankDay(), parsed);
      // deep-merge nested defaults in case schema grew
      state[key].emails = Object.assign(blankDay().emails, parsed.emails||{});
      state[key].jobtracking = Object.assign(blankDay().jobtracking, parsed.jobtracking||{});
    } else {
      state[key] = blankDay();
    }
  }catch(e){
    state[key] = blankDay();
  }
  return state[key];
}

  try{

/* ---------------- Autocomplete / word suggestions ---------------- */
async function loadSuggestionsOnce(){
  if(window.__suggestions) return;
  try{
    const res = await storageGet('suggestions');
    window.__suggestions = (res && res.value) ? JSON.parse(res.value) : {};
  }catch(e){ window.__suggestions = {}; }
}
function recordSuggestion(key, value){
  value = (value||'').trim();
  if(!value) return;
  window.__suggestions = window.__suggestions || {};
  const arr = window.__suggestions[key] = window.__suggestions[key] || [];
  if(!arr.some(s=>s.toLowerCase()===value.toLowerCase())){
    arr.unshift(value);
    if(arr.length>30) arr.length = 30;
    storageSet('suggestions', JSON.stringify(window.__suggestions));
  }
}
function ensureAcDropdown(){
  let d = document.getElementById('acDropShared');
  if(!d){
    d = document.createElement('div');
    d.id = 'acDropShared';
    d.className = 'ac-drop';
    d.style.display = 'none';
    document.body.appendChild(d);
  }
  return d;
}
function showSuggestions(el, key){
  const all = (window.__suggestions && window.__suggestions[key]) || [];
  const val = el.value.trim().toLowerCase();
  let matches = all.filter(s=>s.toLowerCase()!==val);
  if(val) matches = matches.filter(s=>s.toLowerCase().includes(val));
  matches = matches.slice(0,6);
  const drop = ensureAcDropdown();
  if(matches.length===0){ drop.style.display='none'; return; }
  drop.innerHTML = matches.map(s=>`<div data-val="${escapeAttr(s)}">${escapeHtml(s)}</div>`).join('');
  const rect = el.getBoundingClientRect();
  drop.style.left = Math.max(8, rect.left)+'px';
  drop.style.top = (rect.bottom+6)+'px';
  drop.style.width = rect.width+'px';
  drop.style.display = 'block';
  drop.onmousedown = (e)=>{
    const item = e.target.closest('[data-val]');
    if(!item) return;
    e.preventDefault();
    el.value = item.dataset.val;
    el.dispatchEvent(new Event('input'));
    drop.style.display='none';
  };
}
function hideSuggestionsDelayed(){
  setTimeout(()=>{ const d=document.getElementById('acDropShared'); if(d) d.style.display='none'; }, 150);
}
function attachAutocomplete(el, key){
  if(!el || el.dataset.acBound) return;
  el.dataset.acBound = '1';
  el.addEventListener('focus', ()=>showSuggestions(el,key));
  el.addEventListener('input', ()=>showSuggestions(el,key));
  el.addEventListener('blur', ()=>{ hideSuggestionsDelayed(); recordSuggestion(key, el.value); });
}

/* ---------------- Completion helpers ---------------- */
function isTodayFullyDone(day){
  const fixedDone = day.checklist.every(c=>c.done);
  const customDone = day.customTasks.every(c=>c.done);
  return fixedDone && customDone;
}
function pendingSummary(day){
  const items = [];
  day.checklist.forEach(c=>{
    if(!c.done){
      const meta = FIXED_TASKS.find(f=>f.id===c.id);
      items.push(meta.label);
    }
  });
  day.customTasks.forEach(c=>{ if(!c.done) items.push(c.text); });
  return items;
}

/* ---------------- Render: Follow-ups ---------------- */
function followupDueInfo(f){
  if(!f.dueAt) return {cls:'ok', text:'No due time set'};
  const due = new Date(f.dueAt);
  const now = new Date();
  const diffMin = (due-now)/60000;
  const label = due.toLocaleString('en-GB',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});
  if(diffMin<=0) return {cls:'over', text:'Overdue — was due '+label};
  if(diffMin<=60) return {cls:'soon', text:'Due soon — '+label};
  return {cls:'ok', text:'Due '+label};
}
async function renderFollowups(){
  const list = await loadFollowups();
  const open = list.filter(f=>!f.done);
  const done = list.filter(f=>f.done);
  const dueNow = open.filter(f=>f.dueAt && new Date(f.dueAt)<=new Date());

  let html = '';
  if(dueNow.length>0){
    html += `<div class="banner danger"><div class="ico">⏰</div><div><b>${dueNow.length} task(s) due now</b>These need attention or their time has come.</div></div>`;
  }

  html += sectionOpen('Add a follow-up / pending task','');
  html += `<div class="card"><div class="followform">
    <input type="text" id="addFollowupText" placeholder="What needs to be done…">
    <input type="datetime-local" id="addFollowupDue">
    <label class="chkrow"><input type="checkbox" id="addFollowupApproval"> Needs manager approval</label>
    <button class="btn" data-action="addFollowup">Add to Follow-ups</button>
  </div></div>`;
  html += sectionClose();

  html += sectionOpen('Pending', open.length+'');
  html += '<div class="card">';
  if(open.length===0){
    html += '<div class="empty">Nothing pending right now.</div>';
  } else {
    open.slice().reverse().forEach(f=>{
      const info = followupDueInfo(f);
      const cardCls = info.cls==='over' ? 'urgent' : 'pending';
      html += `<div class="item ${cardCls}">
        <button class="chk" data-action="toggleFollowup" data-id="${f.id}"></button>
        <div class="body">
          <div class="label">${escapeHtml(f.text)}</div>
          <span class="duebadge ${info.cls}">${info.text}</span>
          ${f.needsApproval ? '<span class="badge">Needs manager approval</span>' : ''}
        </div>
        <button class="del" data-action="delFollowup" data-id="${f.id}">✕</button>
      </div>`;
    });
  }
  html += '</div>';
  html += sectionClose();

  if(done.length>0){
    html += sectionOpen('Completed', done.length+'');
    html += '<div class="card">';
    done.slice().reverse().forEach(f=>{
      html += `<div class="item complete">
        <button class="chk" data-action="toggleFollowup" data-id="${f.id}">✓</button>
        <div class="body"><div class="label">${escapeHtml(f.text)}</div></div>

      </div>`;
    });
    html += '</div>';
    html += sectionClose();
  }

  document.getElementById('main').innerHTML = html;
  attachAutocomplete(document.getElementById('addFollowupText'), 'followup');
}

async function generateReportPDF(){

  const pageW = doc.internal.pageSize.getWidth();
  const margin = 40;
  let y = 46;

  const amber = [232,163,61];
  const dark = [17,23,31];
  const teal = [56,150,163];

  doc.setFont('helvetica','bold'); doc.setFontSize(18); doc.setTextColor(20,20,20);
  doc.text('GETCAB', margin, y); y+=18;
  doc.setFontSize(11); doc.setTextColor(90,90,90);
  doc.text('DAILY OPERATIONS REPORT', margin, y); y+=16;
  doc.setDrawColor(210,210,210); doc.line(margin, y, pageW-margin, y); y+=16;

  doc.setFont('helvetica','normal'); doc.setFontSize(10); doc.setTextColor(40,40,40);
  doc.text(`Date: ${r.date}    |    Operator: ${r.operator}    |    Shift: ${r.shift}`, margin, y);
  y += 18;

  function sectionBar(title){
    doc.setFillColor(...dark);
    doc.rect(margin, y, pageW-margin*2, 20, 'F');
    doc.setTextColor(255,255,255); doc.setFont('helvetica','bold'); doc.setFontSize(10.5);
    doc.text(title, margin+8, y+14);
    y += 20;
  }

  // Accounts & Jobs Count — two-column layout like the reference sheet
  sectionBar('ACCOUNTS & JOBS COUNT');
  const half = Math.ceil(r.accounts.length/2);
  const left = r.accounts.slice(0, half);
  const right = r.accounts.slice(half);
  const acctRows = [];
  for(let i=0;i<Math.max(left.length,right.length);i++){
    acctRows.push([
      left[i]?left[i].name:'', left[i]?String(left[i].jobs):'',
      right[i]?right[i].name:'', right[i]?String(right[i].jobs):''
    ]);
  }
  const total = r.accounts.reduce((s,a)=>s+(a.jobs||0),0);
  doc.autoTable({
    startY:y, margin:{left:margin,right:margin},
    head:[['PARTNER / ACCOUNT','JOBS','PARTNER / ACCOUNT','JOBS']],
    body:acctRows,
    theme:'grid',
    styles:{fontSize:8.5, cellPadding:4, textColor:[30,30,30]},
    headStyles:{fillColor:[235,235,235], textColor:[20,20,20], fontStyle:'bold'},
    columnStyles:{1:{cellWidth:40, halign:'center'}, 3:{cellWidth:40, halign:'center'}},
    foot:[['TOTAL JOBS TODAY', String(total), '', '']],
    footStyles:{fillColor:[...amber], textColor:[30,20,5], fontStyle:'bold'},
  });
  y = doc.lastAutoTable.finalY + 14;

  // Daily Checklist
  checkPageBreak(70);
  sectionBar('DAILY CHECKLIST');
  doc.autoTable({
    startY:y, margin:{left:margin,right:margin},
    head:[['CHECK ITEM','STATUS']],
    body:[
      ...r.checklist.map(c=>[c.label, c.status]),
      ['Unmarked jobs on Talixo', r.talixoUnmarked||'-'],
      ['Last-minute cancellations / No Shows', r.lastMinuteCancellations||'0']
    ],

function buildReportFilename(r){
  // Turns a date into "Qasim_Report_20th_Sep.pdf" style, matching Qasim's own report naming.
  let d = null;
  const m = (r.date||'').match(/(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})/);
  if(m){
    let [_, dd, mm, yy] = m;
    yy = yy.length===2 ? '20'+yy : yy;
    d = new Date(parseInt(yy,10), parseInt(mm,10)-1, parseInt(dd,10));
  }
  if(!d || isNaN(d.getTime())) d = new Date();

  const day = d.getDate();
  const suffix = (day%10===1 && day!==11) ? 'st' : (day%10===2 && day!==12) ? 'nd' : (day%10===3 && day!==13) ? 'rd' : 'th';
  const month = d.toLocaleDateString('en-GB', {month:'short'});
  const operatorName = (r.operator||'Qasim').trim().split(/\s+/)[0] || 'Qasim';
  return `${operatorName}_Report_${day}${suffix}_${month}.pdf`;
}

/* ---------------- Router ---------------- */
async function render(){
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('active', b.dataset.tab===activeTab));
  if(activeTab==='today') await renderToday();
  else if(activeTab==='tomorrow') await renderTomorrow();
  else if(activeTab==='yesterday') await renderYesterday();
  else if(activeTab==='notes') await renderNotes();
  else if(activeTab==='mistakes') await renderMistakes();
  else if(activeTab==='questions') await renderQuestions();
  else if(activeTab==='followups') await renderFollowups();
  else if(activeTab==='scripts') await renderScripts();
  else if(activeTab==='report') await renderReport();
  refreshTabBadges();
}

async function refreshTabBadges(){
  const [mistakes, questions, followups] = await Promise.all([loadMistakes(), loadQuestions(), loadFollowups()]);
  const openQ = questions.filter(q=>!q.done).length;
  const now = new Date();
  const dueF = followups.filter(f=>!f.done && f.dueAt && new Date(f.dueAt)<=now).length;
  const openF = followups.filter(f=>!f.done).length;
  setTabLabel('mistakes', '⚠️ Mistakes', mistakes.length, mistakes.length>0);
  setTabLabel('questions', '❓ Questions', openQ, false);
  setTabLabel('followups', '⏳ Follow-ups', dueF>0?dueF:openF, dueF>0);
}
function setTabLabel(tab, base, count, urgent){
  const btn = document.querySelector(`#tabs button[data-tab="${tab}"]`);
  if(!btn) return;
  btn.textContent = count>0 ? `${base} (${count})` : base;
  btn.style.color = urgent ? 'var(--red)' : '';
}

document.getElementById('tabs').addEventListener('click', e=>{

// Cross-device freshness happens here instead: a quiet background refresh, not tied to
// clicking, so it can never block a tap or race against a save that's still in flight.
// Runs periodically, and immediately whenever you come back to the app (switch back from
// another app, wake your laptop, etc.) — the Report tab is skipped so it never overwrites
// text you're mid-way through editing there.
async function backgroundRefresh(){
  if(!FIREBASE_READY) return;
  if(activeTab === 'report') return;
  // never reload from the cloud while a save is in flight or the last save failed
  if(pendingWrites > 0 || lastWriteError) return;
  delete state[todayKey]; delete state[tomorrowKey]; delete state[yesterdayKey];
  mistakesCache = null; questionsCache = null; followupsCache = null;
  window.__notesCache = null; window.__scriptsCache = null;
  render();
}
setInterval(backgroundRefresh, 30000);
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState === 'visible') backgroundRefresh();
});

/* Enter-to-submit on text inputs */
document.getElementById('main').addEventListener('keydown', (e)=>{
  if(e.key==='Enter' && e.target.tagName==='INPUT'){
    const map = {
      addTodayInput:'addCustomToday', addCallInput:'addCall', addNoShowInput:'addNoShow',
      addTomorrowInput:'addTomorrowLog', addNoteInput:'addNote',
      addMistakeInput:'addMistake', addQuestionInput:'addQuestion', addFollowupText:'addFollowup'
    };
    const action = map[e.target.id];
    if(action){
      const btn = document.querySelector(`[data-action="${action}"]`);
      if(btn) btn.click();
    }
  }
});

function askImportantNote(){
  const yes = confirm('All customers on today\'s call list are marked done.\n\nAny important thing to tell the team about these jobs?');
  if(yes){
    const txt = prompt('Type the note for the manager:');
    if(txt && txt.trim()){
      loadNotes().then(notes=>{
        notes.push({id:uid(), text:txt.trim(), done:false, ts:new Date().toLocaleString('en-GB',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})});
        return saveNotes(notes);
      });
    }
  }
}

function updateSyncBadge(){
  const el = document.getElementById('syncBadge');
  if(!el) return;
  if(FIREBASE_READY && lastWriteError){
    el.textContent = '❌ Cloud save FAILED (' + lastWriteError + ') — saved on this device only';
    el.style.color = 'var(--red)';
  } else if(FIREBASE_READY){
    el.textContent = '☁️ Synced across devices';
    el.style.color = 'var(--green)';
  } else if(HAS_CLOUD_STORAGE){
    el.textContent = '☁️ Synced via Claude.ai';
    el.style.color = 'var(--green)';
  } else {
    el.textContent = '⚠️ This device only — Firebase not set up';
    el.style.color = 'var(--amber)';
  }
}
